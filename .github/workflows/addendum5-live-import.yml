name: Addendum 5 Live Import Check

on:
  push:
    branches:
      - audit/addendum5-live-import-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact live-branch clone
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile mobile backend dependencies
        run: python -m py_compile approval_guardrails.py approval_links.py dashboard_data.py signal_tracker.py kalshi_readonly.py kalshi_submit.py mobile_backend.py
      - name: Import mobile backend
        run: python -c "import mobile_backend; print('IMPORT_OK')"
      - name: Run mobile backend smoke test
        run: python test_mobile_backend.py
