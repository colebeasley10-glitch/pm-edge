name: AutoTrader Paper Tests

on:
  push:
    branches: [main]
    paths:
      - 'autotrader/**'
      - 'test_autotrader_*.py'
      - 'test_quick_whale_v2.py'
      - 'whale_edge.py'
      - 'candidate_tracker.py'
      - 'tests/**'
      - 'pmedge/**'
      - '.github/workflows/autotrader-paper-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest -v
          test_autotrader_paper
          test_autotrader_scanner
          test_autotrader_evaluator
          test_autotrader_engine
          test_autotrader_storage_collector
          test_autotrader_probability_runner
          test_autotrader_fees
          test_autotrader_p0_guards
          test_autotrader_recorder_store
          test_fair_v2
          test_autotrader_exit_maker
          test_production_mirror
          test_weather_shadow
          test_lead_lag
          test_autotrader_learning
          test_autotrader_security
          test_quick_whale_v2
          test_autotrader_audit_hardening
          test_autotrader_phase2_shadow
