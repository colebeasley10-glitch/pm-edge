name: AutoTrader Paper Tests
on:
  push:
    branches: [main]
    paths:
      - 'autotrader/**'
      - 'test_autotrader_paper.py'
      - 'test_autotrader_scanner.py'
      - 'test_autotrader_evaluator.py'
      - 'test_autotrader_engine.py'
      - 'test_autotrader_storage_collector test_autotrader_probability_runner.py'\n      - 'test_autotrader_probability_runner.py'
      - '.github/workflows/autotrader-paper-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_autotrader_paper test_autotrader_scanner test_autotrader_evaluator test_autotrader_engine test_autotrader_storage_collector
