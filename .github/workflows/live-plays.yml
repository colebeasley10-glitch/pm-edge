name: Live Today's Plays

# REAL MONEY. Runs right after each Research Lab round and copies new Today's Plays paper
# picks (both lanes, ONE bet per game):
#   * Kalshi picks     -> $5 immediate-or-cancel Kalshi order at the price the paper pick saw
#   * Polymarket picks -> Pushover alert to bet $5 by hand (log it on the Home tab)
# Hard limits in live_plays/core.py: $5 per bet, $50 per Eastern day (env can only lower them).
# Kill switch: set the repo variable LIVE_PLAYS_ENABLED to 0 (then it only logs dry runs).
on:
  workflow_run:
    workflows: ["Strategy Research Lab (paper)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: live-plays
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live plays round
        env:
          LIVE_PLAYS_ENABLED: ${{ github.ref == 'refs/heads/main' && (vars.LIVE_PLAYS_ENABLED || '1') || '0' }}
          KALSHI_WRITE_API_KEY_ID: ${{ github.ref == 'refs/heads/main' && secrets.KALSHI_WRITE_API_KEY_ID || '' }}
          KALSHI_WRITE_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.KALSHI_WRITE_PRIVATE_KEY || '' }}
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          LIVE_PLAYS_PER_BET: "5"
          LIVE_PLAYS_DAILY_BUDGET: "50"
        run: python -m live_plays.run
      - name: Save live bets
        if: always()
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add live_plays/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Live Today's Plays round [skip ci]"
          # Only this job writes live_plays/data, so a plain rebase never conflicts.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
