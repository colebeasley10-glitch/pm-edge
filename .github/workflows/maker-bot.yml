name: Maker Bot

# REAL MONEY when the repo variable MAKER_BOT_ENABLED is "1"; otherwise a dry run that
# only logs what it would have posted. Runs right after each Research Lab round so the
# Pinnacle fair prices in research_lab/data/maker_candidates.json are minutes old.
# Posts $1 post-only Kalshi limit orders priced better than Pinnacle's fair line.
# Kalshi expires every order by itself at the earlier of 50 min or 5 min before start.
# Hard limits in maker_bot/core.py: $1 per order, $20 per Eastern day, one bet per game.
on:
  workflow_run:
    workflows: ["Strategy Research Lab (paper)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: maker-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maker:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Maker round
        env:
          MAKER_BOT_ENABLED: ${{ github.ref == 'refs/heads/main' && vars.MAKER_BOT_ENABLED || '0' }}
          KALSHI_WRITE_API_KEY_ID: ${{ github.ref == 'refs/heads/main' && secrets.KALSHI_WRITE_API_KEY_ID || '' }}
          KALSHI_WRITE_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.KALSHI_WRITE_PRIVATE_KEY || '' }}
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
          # Day 1 mechanics check (Oct 21, 2026): $1 unit, $5/day. Next step: $5 unit, $25/day
          # (delete these two lines). Code ceilings in maker_bot/core.py cap anything set here.
          MAKER_BOT_UNIT: "1"
          MAKER_BOT_DAILY_BUDGET: "5"
        run: python -m maker_bot.run
      - name: Save orders
        if: always()
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add maker_bot/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Maker Bot round [skip ci]"
          # Only this job writes maker_bot/data, so a plain rebase never conflicts.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
