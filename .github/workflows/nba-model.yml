name: NBA Game Model (paper)

# PAPER ONLY. Logs the NBA model's side of every game's spread, total and moneyline,
# freezes the line at that moment, keeps reading it until tip (closing line -> CLV),
# and grades it after the final. Schedule, scores and odds come from ESPN's free
# scoreboard (no key, no quota). New STRONG picks push to your phone. No Kalshi keys.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [tick]   # same cron-job.org tick as the NCAA lanes (GitHub's schedule skips runs)
  schedule:
    - cron: "40 * * * *"

concurrency:
  group: nba-model
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Restore ESPN cache
        uses: actions/cache@v4
        with:
          path: .espn_nba_cache.json
          key: nba-model-${{ github.run_id }}
          restore-keys: nba-model-

      - name: Grade
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python -m nba_grader.run

      - name: Save picks
        if: always()
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add nba_grader/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NBA model round [skip ci]"
          # Only this job writes nba_grader/data, so a plain rebase never conflicts.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
