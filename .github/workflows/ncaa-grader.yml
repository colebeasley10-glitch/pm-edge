name: NCAA Model Grader (paper)

# PAPER ONLY. Logs the NCAA model's side of every FBS spread, total and moneyline,
# freezes the line at that moment, and grades it after the game (W-L, units, CLV).
# Schedule, scores and odds come from ESPN's free scoreboard (no key, no quota).
# CFBD is optional (CORE ratings ~1 call/day); the grader runs fine without it.
# Hourly: the first read freezes the pick, the last read before kickoff is the closing line.
# The season backtest runs by itself once CFBD answers (needs its historical lines). No Kalshi keys.
#
# Backtest weeks already played: Actions -> NCAA Model Grader -> Run workflow -> tick "backtest".
on:
  workflow_dispatch:
    inputs:
      backtest:
        description: "Replay this season's played weeks (no look-ahead)"
        type: boolean
        default: false
  repository_dispatch:
    types: [tick]   # same cron-job.org tick that drives the NCAA beta (GitHub's schedule skips runs)
  schedule:
    - cron: "20 * * * *"

concurrency:
  group: ncaa-grader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests rapidfuzz

      - name: Restore ESPN/CFBD cache (falls back to the NCAA beta's copy)
        uses: actions/cache@v4
        with:
          path: |
            .ncaa_beta_cfbd_cache.json
            .espn_cfb_cache.json
          key: ncaa-grader-${{ github.run_id }}
          restore-keys: |
            ncaa-grader-
            ncaa-beta-

      - name: Grade
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          BACKTEST: ${{ github.event.inputs.backtest }}
        run: |
          if [ "$BACKTEST" = "true" ]; then
            python -m ncaa_grader.run --backtest
          else
            python -m ncaa_grader.run
          fi

      # Nov 1, 2026: refresh this week's NCAA pool cards (Clay's / Chappy's) from the newest market
      # until Saturday noon ET, then freeze them; grade picks as finals come in. Paper only.
      - name: Pool cards
        continue-on-error: true
        run: python -m ncaa_pool.weekly

      # Nov 4, 2026: Saturday 9am-noon ET, one phone alert if the model's card (Pinnacle line) has moved
      # away from the picks locked in SharpIQ. No change, no alert.
      - name: Saturday pool re-check
        continue-on-error: true
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: python -m ncaa_pool.recheck

      - name: Save picks
        if: always()
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add ncaa_grader/data
          git add ncaa_pool/data/cards ncaa_pool/data/my_picks ncaa_pool/data/variants ncaa_pool/data/recheck_alerts.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NCAA grader round [skip ci]"
          # Only this job writes ncaa_grader/data, so a plain rebase never conflicts.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
