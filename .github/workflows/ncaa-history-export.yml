name: NCAA History Export (one-off)

# One-off pull of CFBD games, lines, PPA, talent and returning production (2022-2026)
# for the Claude NCAA pool-model rebuild. Output is a workflow artifact only (not committed).
on:
  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "Only delete the temporary tmp-ncaa-history branch"
        type: boolean
        default: false

jobs:
  cleanup:
    if: ${{ github.event.inputs.cleanup_only == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete tmp-ncaa-history || true
  export:
    if: ${{ github.event.inputs.cleanup_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Export
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python tools/ncaa_history_export.py
      - name: Push to a temporary branch (deleted after download)
        run: |
          tar czf /tmp/h.tgz ncaa_history_export
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git checkout --orphan tmp-ncaa-history
          git rm -rfq .
          cp /tmp/h.tgz ncaa_history.tgz
          git add ncaa_history.tgz
          git commit -qm "temp NCAA history export"
          git push -f origin HEAD:refs/heads/tmp-ncaa-history
