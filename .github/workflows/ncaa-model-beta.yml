name: NCAA Model Beta

on:
  workflow_dispatch:
  schedule:
    - cron: "15,45 * * * *"

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Restore NCAA beta state
        uses: actions/cache@v4
        with:
          path: .ncaa_beta_state.json
          key: ncaa-beta-${{ github.run_id }}
          restore-keys: |
            ncaa-beta-

      - name: Run NCAA model beta
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          PM_EDGE_APPROVAL_SECRET: ${{ secrets.PM_EDGE_APPROVAL_SECRET }}
          PM_EDGE_APPROVAL_TTL_SECONDS: "1800"
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
          NCAA_BETA_MIN_TOTAL_EDGE: "4.0"
          NCAA_BETA_MIN_SPREAD_EDGE: "3.0"
          NCAA_BETA_MIN_PROB: "0.57"
          NCAA_BETA_TOTAL_SD: "14.0"
          NCAA_BETA_MARGIN_SD: "16.0"
          NCAA_BETA_PRICE_BUFFER: "0.055"
          NCAA_BETA_MAX_FISH_GAP: "0.05"
          NCAA_BETA_MAX_ALERTS: "3"
          NCAA_BETA_COOLDOWN_HOURS: "6"
          NCAA_BETA_MAX_RISK_DOLLARS: "5.00"
          NCAA_BETA_MAX_SHARES: "20"
        run: python ncaa_beta_runner.py
