name: NCAA Basketball Model (paper)

# PAPER ONLY. Projects every D1 game with ncaab_model, prices spread/total/moneyline with the
# backtest-calibrated probability, logs each at a frozen line + timestamp, tracks the closing line
# until tip (CLV), settles finals against a $500 paper bankroll and writes the daily report +
# Excel export. Schedule, scores, odds and box scores come from ESPN's free feed (no key).
on:
  workflow_dispatch:
  repository_dispatch:
    types: [tick]   # same cron-job.org tick as the other lanes (GitHub's schedule skips runs)
  schedule:
    - cron: "50 * * * *"

concurrency:
  group: ncaab-model
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy openpyxl

      - name: Restore ESPN cache
        uses: actions/cache@v4
        with:
          path: |
            .espn_ncaab_cache.json
            .espn_ncaab_poss_cache.json
          key: ncaab-model-${{ github.run_id }}
          restore-keys: ncaab-model-

      - name: Run
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          # No Pushover secrets on purpose: phone alerts stay limited to Bet Queue + BreakTheBank NFL.
        run: python -m ncaab_grader.run

      - name: Save picks
        if: always()
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add ncaab_grader/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NCAAB model round [skip ci]"
          # Only this job writes ncaab_grader/data, so a plain rebase never conflicts.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
