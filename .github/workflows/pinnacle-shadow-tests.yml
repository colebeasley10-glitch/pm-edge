name: Pinnacle Shadow Tests

on:
  push:
    branches: [main]
    paths:
      - "pinnacle_shadow.py"
      - "candidate_tracker.py"
      - "pmedge/**"
      - ".github/workflows/pm-edge-watch.yml"
      - ".github/workflows/pinnacle-shadow-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "pinnacle_shadow.py"
      - "candidate_tracker.py"
      - "pmedge/**"
      - ".github/workflows/pm-edge-watch.yml"
      - ".github/workflows/pinnacle-shadow-tests.yml"

permissions:
  contents: read

jobs:
  shadow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile shadow code
        run: python -m py_compile candidate_tracker.py pinnacle_shadow.py pmedge/fair_value.py pmedge/pricing.py

      - name: Run Pinnacle shadow self-test
        run: python pinnacle_shadow.py --self-test
