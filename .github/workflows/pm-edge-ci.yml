name: PM Edge CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Compile changed runtime
        run: python -m py_compile watcher.py pm_edge_runner_v16.py pm_edge_runner_v21.py pm_edge_runner_v26.py
      - name: Run PM Edge self-tests
        run: |
          python pm_edge_runner_v16.py --self-test
          python pm_edge_runner_v21.py --self-test
          python pm_edge_runner_v26.py --self-test
          python -m pytest -q
