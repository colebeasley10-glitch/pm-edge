name: PM Edge Approval Link Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pm-edge-link-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4

      - name: Send signed approval-link test
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PM_EDGE_APPROVAL_SECRET: ${{ secrets.PM_EDGE_APPROVAL_SECRET }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import approval_links

          token = approval_links.create_approval_token(
              ticker="KXMLBGAME-26SEP171915PHINYM-NYM",
              side="YES",
              lane="primary",
              execution="MAKE",
              limit_price=0.01,
              shares=1,
              max_loss=0.01,
              fair_probability=0.50,
              net_edge=0.0,
              books=1,
              ttl_seconds=1800,
          )
          url = approval_links.build_approval_url(os.environ["STREAMLIT_APP_URL"], token)
          payload = urllib.parse.urlencode({
              "token": os.environ["PUSHOVER_APP_TOKEN"],
              "user": os.environ["PUSHOVER_USER_KEY"],
              "title": "🧪 PM EDGE LINK TEST — DO NOT BET",
              "message": "TEST ONLY. Tap Review test link. Do NOT place or submit any Kalshi order. We are only checking that the approval page opens correctly.",
              "url": url,
              "url_title": "Review test link",
          }).encode()
          req = urllib.request.Request("https://api.pushover.net/1/messages.json", data=payload, method="POST")
          with urllib.request.urlopen(req, timeout=15) as response:
              if response.status != 200:
                  raise RuntimeError(f"Pushover returned {response.status}")
          print("PM_EDGE_APPROVAL_LINK_TEST_SENT")
          PY
