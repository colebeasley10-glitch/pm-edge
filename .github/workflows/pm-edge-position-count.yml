name: PM Edge Position Count

on:
  push:
    paths:
      - ".github/workflows/pm-edge-position-count.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Count current open Kalshi positions
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PM_EDGE_KALSHI_READONLY_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
        run: |
          python - <<'PY'
          import json
          from kalshi_readonly import KalshiReadOnlyClient
          c = KalshiReadOnlyClient.from_env()
          p = c._get("/portfolio/positions", params={"limit": 200})
          rows = p.get("market_positions", [])
          active=[]
          for x in rows:
              pos = x.get("position_fp", x.get("position", 0))
              try: nz=float(pos)!=0
              except: nz=bool(pos)
              if nz:
                  active.append({
                    "ticker":x.get("ticker"),
                    "position":pos,
                    "market_exposure":x.get("market_exposure_dollars",x.get("market_exposure")),
                    "fees_paid":x.get("fees_paid_dollars",x.get("fees_paid")),
                    "realized_pnl":x.get("realized_pnl_dollars",x.get("realized_pnl"))
                  })
          print("ACTIVE_COUNT",len(active))
          print(json.dumps(active, indent=2, sort_keys=True))
          PY
