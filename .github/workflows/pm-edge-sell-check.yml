name: PM Edge Sell Check

on:
  push:
    paths:
      - ".github/workflows/pm-edge-sell-check.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Inspect open positions and live sell marks
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PM_EDGE_KALSHI_READONLY_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
        run: |
          python - <<'PY'
          import json, requests
          from kalshi_readonly import KalshiReadOnlyClient
          c=KalshiReadOnlyClient.from_env()
          p=c._get("/portfolio/positions", params={"limit":200})
          rows=p.get("market_positions",[])
          out=[]
          for x in rows:
              pos=float(x.get("position_fp",x.get("position",0)) or 0)
              if pos==0: continue
              t=x.get("ticker")
              r=requests.get(f"https://external-api.kalshi.com/trade-api/v2/markets/{t}",timeout=10)
              md=r.json().get("market",{}) if r.ok else {}
              exp=float(x.get("market_exposure_dollars",x.get("market_exposure",0)) or 0)
              qty=abs(pos)
              entry=exp/qty if qty else None
              if pos>0:
                  sell=md.get("yes_bid_dollars",md.get("yes_bid"))
                  side="YES"
              else:
                  sell=md.get("no_bid_dollars",md.get("no_bid"))
                  side="NO"
              try:
                  sell=float(sell)
                  if sell>1: sell/=100
              except: sell=None
              out.append({
                "title":md.get("title"),
                "ticker":t,
                "side":side,
                "shares":qty,
                "entry_est":round(entry,4) if entry is not None else None,
                "sell_bid":sell,
                "change_per_share":round(sell-entry,4) if sell is not None and entry is not None else None,
                "status":md.get("status")
              })
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
