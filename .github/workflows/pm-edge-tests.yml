name: PM Edge Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile approval and performance code
        run: python -m py_compile approval_links.py position_actions.py position_signals.py kalshi_readonly.py kalshi_submit.py performance_tracker.py signal_tracker.py pushover_status.py pm_edge_runner_v24.py pm_edge_runner_v25.py pm_edge_runner_v26.py pm_edge_runner_v27.py ncaa_beta_runner.py pages/Approve.py pages/Position_Action.py

      - name: Run Phase 0 golden equivalence
        run: python tests/phase0_golden_probe.py --verify-parent

      - name: Run Commit 2 engine-fix tests
        run: python test_pm_edge_commit2.py

      - name: Run Commit 3 provenance tests
        run: python test_pm_edge_commit3.py

      - name: Run regression tests
        run: python test_pm_edge_regressions.py

      - name: Run v18 launcher self-test
        run: python pm_edge_runner_v18.py --self-test

      - name: Run v19 launcher self-test
        run: python pm_edge_runner_v19.py --self-test

      - name: Run v20 launcher self-test
        run: python pm_edge_runner_v20.py --self-test

      - name: Run v21 launcher self-test
        run: python pm_edge_runner_v21.py --self-test

      - name: Run v22 VALUE-lane tests
        run: python test_pm_edge_v22.py

      - name: Run execution guard tests
        run: python test_execution_guard.py

      - name: Run v23 launcher self-test
        run: python pm_edge_runner_v23.py --self-test

      - name: Run approval link tests
        run: python test_approval_links.py

      - name: Run read-only Kalshi client tests
        run: python test_kalshi_readonly.py

      - name: Run one-tap Kalshi submit tests
        run: python test_kalshi_submit.py

      - name: Run position action token tests
        run: python test_position_actions.py

      - name: Run position signal tests
        run: python test_position_signals.py

      - name: Run execution reconciliation tests
        run: python test_execution_reconcile.py

      - name: Run settlement/performance tracker tests
        run: python test_performance_tracker.py

      - name: Run durable signal ledger tests
        run: python test_signal_tracker.py

      - name: Run v26 quality-guard self-test
        run: python pm_edge_runner_v26.py --self-test

      - name: Run v27 audit-guard self-test
        run: python pm_edge_runner_v27.py --self-test

      - name: Run Pushover taken-status tests
        run: python test_pushover_status.py

      - name: Run v24 launcher self-test
        run: python pm_edge_runner_v24.py --self-test

      - name: Run v25 launcher self-test
        run: python pm_edge_runner_v25.py --self-test
