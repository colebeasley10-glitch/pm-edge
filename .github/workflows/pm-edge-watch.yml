name: PM Edge Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: pm-edge-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore watcher state
        uses: actions/cache@v4
        with:
          path: .pm_edge_watch_state.json
          key: pm-edge-watch-${{ github.run_id }}
          restore-keys: |
            pm-edge-watch-

      - name: Run PM Edge watcher
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}

          PM_EDGE_ODDS_DAILY_BUDGET: "14"
          PM_EDGE_MAX_ODDS_REFRESH_PER_RUN: "3"
          PM_EDGE_EVENT_CACHE_HOURS: "8"

          PM_EDGE_MIN_NET_EDGE: "0.04"
          PM_EDGE_MODEL_ERROR_BUFFER: "0.01"
          PM_EDGE_SLIPPAGE_BUFFER: "0.0025"
          PM_EDGE_MIN_MATCH_CONFIDENCE: "0.82"

          PM_EDGE_MAX_ALERTS_PER_RUN: "3"
          PM_EDGE_ALERT_COOLDOWN_HOURS: "6"
          PM_EDGE_MAX_MARKETS: "3000"

          # Price Fish: keep the normal 4% edge requirement, fish 2c-8c below
          # the current ask, and reject unrealistic moonshot prices.
          PM_EDGE_PRICE_FISH_MIN_GAP: "0.02"
          PM_EDGE_PRICE_FISH_MAX_GAP: "0.08"
          PM_EDGE_PRICE_FISH_MIN_TARGET: "0.20"
          PM_EDGE_PRICE_FISH_MIN_FAIR_SIDE_PROB: "0.25"
          PM_EDGE_MAX_PRICE_FISH_ALERTS_PER_RUN: "4"
          PM_EDGE_PRICE_FISH_DAILY_CAP: "12"

          # v20 automatic sizing: target about $5 gross win profit while
          # capping contract cost / max loss at $10 on any one alert.
          PM_EDGE_TARGET_WIN_PROFIT_DOLLARS: "5.00"
          PM_EDGE_MAX_RISK_DOLLARS: "10.00"

          # v21 overnight look-ahead. From 8-11 PM Eastern, prioritize games
          # that start while the owner is normally asleep. During 11 PM-7 AM,
          # defer ordinary actionable pushes until wake-up, while PASS/CANCEL
          # safety alerts remain enabled. Four of the existing 14 daily Odds
          # API budget units are reserved until the pre-bed window.
          PM_EDGE_LOCAL_TIMEZONE: "America/New_York"
          PM_EDGE_PREBED_START_HOUR: "20"
          PM_EDGE_SLEEP_START_HOUR: "23"
          PM_EDGE_WAKE_HOUR: "7"
          PM_EDGE_PREBED_LOOKAHEAD_HOURS: "14"
          PM_EDGE_PREBED_PRIORITY_BONUS: "100"
          PM_EDGE_MORNING_PRIORITY_BONUS: "35"
          PM_EDGE_PREBED_FAIR_TTL_HOURS: "1.5"
          PM_EDGE_MORNING_FAIR_TTL_HOURS: "2.0"
          PM_EDGE_PREBED_MAX_ODDS_REFRESH_PER_RUN: "5"
          PM_EDGE_PREBED_RESERVED_ODDS_CREDITS: "4"
          PM_EDGE_MORNING_LOOKAHEAD_AFTER_WAKE_HOURS: "4"
          PM_EDGE_OVERNIGHT_MISSED_RETENTION_DAYS: "14"

        run: python pm_edge_runner_v21.py
