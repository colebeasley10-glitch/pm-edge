name: PM Edge Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: pm-edge-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore watcher state
        uses: actions/cache@v4
        with:
          path: |
            .pm_edge_order_queue.json
            .pm_edge_performance_history.json
            .pm_edge_pushover_status.json
            .pm_edge_position_signal_state.json
          key: pm-edge-watch-${{ github.run_id }}
          restore-keys: |
            pm-edge-watch-

      - name: Run PM Edge watcher
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          PM_EDGE_APPROVAL_SECRET: ${{ secrets.PM_EDGE_APPROVAL_SECRET }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PM_EDGE_KALSHI_READONLY_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
          PM_EDGE_ODDS_DAILY_BUDGET: "15"
          PM_EDGE_MAX_ODDS_REFRESH_PER_RUN: "4"
          PM_EDGE_EVENT_CACHE_HOURS: "8"
          PM_EDGE_BULK_FEATURED_ENABLED: "1"
          PM_EDGE_MAX_BULK_SPORTS_PER_RUN: "2"
          PM_EDGE_MIN_NET_EDGE: "0.04"
          PM_EDGE_MODEL_ERROR_BUFFER: "0.01"
          PM_EDGE_SLIPPAGE_BUFFER: "0.0025"
          PM_EDGE_MIN_MATCH_CONFIDENCE: "0.82"
          PM_EDGE_MAX_ALERTS_PER_RUN: "3"
          PM_EDGE_ALERT_COOLDOWN_HOURS: "6"
          PM_EDGE_MAX_MARKETS: "3000"
          PM_EDGE_VALUE_MIN_NET_EDGE: "0.030"
          PM_EDGE_STANDARD_MIN_NET_EDGE: "0.030"
          PM_EDGE_STANDARD_THREE_BOOK_EDGE: "0.035"
          PM_EDGE_VALUE_THREE_BOOK_EDGE: "0.035"
          PM_EDGE_VALUE_MIN_BOOKS: "3"
          PM_EDGE_VALUE_MIN_TARGET: "0.20"
          PM_EDGE_VALUE_MAX_TARGET: "0.80"
          PM_EDGE_VALUE_MIN_FAIR_SIDE_PROB: "0.25"
          PM_EDGE_VALUE_DAILY_CAP: "20"
          PM_EDGE_MAX_SECONDARY_ALERTS_PER_RUN: "6"
          PM_EDGE_VALUE_TARGET_WIN_PROFIT_DOLLARS: "2.50"
          PM_EDGE_VALUE_MAX_RISK_DOLLARS: "5.00"
          PM_EDGE_PRICE_FISH_MIN_GAP: "0.02"
          PM_EDGE_PRICE_FISH_MAX_GAP: "0.08"
          PM_EDGE_PRICE_FISH_MIN_TARGET: "0.20"
          PM_EDGE_PRICE_FISH_MIN_FAIR_SIDE_PROB: "0.25"
          PM_EDGE_MAX_PRICE_FISH_ALERTS_PER_RUN: "6"
          PM_EDGE_PRICE_FISH_DAILY_CAP: "15"
          PM_EDGE_PRICE_FISH_MIN_BOOKS: "3"
          PM_EDGE_PRICE_FISH_MAX_FAIR_AGE_MINUTES: "95"
          PM_EDGE_MAX_BOOK_DISPERSION: "0.055"
          PM_EDGE_MAX_ACTIVE_ALERTS_PER_EVENT: "1"
          PM_EDGE_DAILY_RISK_BUDGET_DOLLARS: "40"
          PM_EDGE_AUDIT_MLB_MIN_NET_EDGE: "0.075"
          PM_EDGE_AUDIT_NFL_TEAM_TOTAL_MIN_NET_EDGE: "0.075"
          PM_EDGE_AUDIT_KBO_MIN_NET_EDGE: "0.065"
          PM_EDGE_AUDIT_RESTRICTED_MIN_BOOKS: "4"
          PM_EDGE_AUDIT_REDUCED_RISK_MULTIPLIER: "0.50"
          PM_EDGE_TARGET_WIN_PROFIT_DOLLARS: "5.00"
          PM_EDGE_MAX_RISK_DOLLARS: "10.00"
          PM_EDGE_EXECUTION_MODE: "preview"
          PM_EDGE_EXECUTION_MAX_ORDER_RISK: "10.00"
          PM_EDGE_EXECUTION_DAILY_RISK_LIMIT: "0"
          PM_EDGE_EXECUTION_QUEUE_RETENTION_DAYS: "14"
          PM_EDGE_APPROVAL_TTL_SECONDS: "1800"
          PM_EDGE_POSITION_ACTION_TTL_SECONDS: "1800"
          PM_EDGE_SELL_OVER_FAIR: "0.08"
          PM_EDGE_ADD_UNDER_FAIR: "0.08"
          PM_EDGE_POSITION_SELL_MIN_BOOKS: "4"
          PM_EDGE_POSITION_ADD_MIN_BOOKS: "4"
          PM_EDGE_POSITION_LIVE_FAIR_MAX_AGE_MINUTES: "20"
          PM_EDGE_POSITION_PREGAME_FAIR_MAX_AGE_MINUTES: "90"
          PM_EDGE_POSITION_ADD_MAX_RISK: "5.00"
          PM_EDGE_POSITION_ADD_MAX_SHARES: "10"
          PM_EDGE_POSITION_SIGNAL_COOLDOWN_HOURS: "4"
          PM_EDGE_POSITION_SIGNAL_MAX_ALERTS_PER_RUN: "2"
          PM_EDGE_HELD_EVENT_LOOKBACK_HOURS: "6"
          PM_EDGE_LOCAL_TIMEZONE: "America/New_York"
          PM_EDGE_PREBED_START_HOUR: "20"
          PM_EDGE_SLEEP_START_HOUR: "23"
          PM_EDGE_WAKE_HOUR: "7"
          PM_EDGE_PREBED_LOOKAHEAD_HOURS: "14"
          PM_EDGE_PREBED_PRIORITY_BONUS: "100"
          PM_EDGE_MORNING_PRIORITY_BONUS: "35"
          PM_EDGE_PREBED_FAIR_TTL_HOURS: "1.5"
          PM_EDGE_MORNING_FAIR_TTL_HOURS: "2.0"
          PM_EDGE_PREBED_MAX_ODDS_REFRESH_PER_RUN: "5"
          PM_EDGE_PREBED_RESERVED_ODDS_CREDITS: "4"
          PM_EDGE_MORNING_RESERVED_ODDS_CREDITS: "2"
          PM_EDGE_POST_WAKE_REVALIDATION_HOURS: "2"
          PM_EDGE_POST_WAKE_PRIORITY_BONUS: "250"
          PM_EDGE_POST_WAKE_MAX_ODDS_REFRESH_PER_RUN: "5"
          PM_EDGE_MORNING_LOOKAHEAD_AFTER_WAKE_HOURS: "4"
          PM_EDGE_OVERNIGHT_MISSED_RETENTION_DAYS: "14"
        run: python pm_edge_runner_v28.py

      - name: Capture PM Edge closing-line value
        env:
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
        run: python clv_tracker.py

      - name: Track all PM Edge signal outcomes
        env:
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
        run: python signal_outcome_tracker.py

      - name: Persist PM Edge audit ledgers
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          [ -f pm_edge_auto_ledger.csv ] && git add pm_edge_auto_ledger.csv
          [ -f pm_edge_signal_ledger.csv ] && git add pm_edge_signal_ledger.csv
          [ -f pm_edge_candidate_ledger.csv ] && git add pm_edge_candidate_ledger.csv
          [ -f pm_edge_clv_ledger.csv ] && git add pm_edge_clv_ledger.csv
          [ -f pm_edge_fill_ledger.csv ] && git add pm_edge_fill_ledger.csv
          [ -f pm_edge_signal_outcomes.csv ] && git add pm_edge_signal_outcomes.csv
          [ -f .pm_edge_watch_state.json ] && git add .pm_edge_watch_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update PM Edge audit ledgers [skip ci]"
            git push
          fi
