name: PM Edge Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: pm-edge-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore watcher state
        uses: actions/cache@v4
        with:
          path: .pm_edge_watch_state.json
          key: pm-edge-watch-${{ github.run_id }}
          restore-keys: |
            pm-edge-watch-

      - name: Run PM Edge watcher
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}

          PM_EDGE_ODDS_DAILY_BUDGET: "14"
          PM_EDGE_MAX_ODDS_REFRESH_PER_RUN: "3"
          PM_EDGE_EVENT_CACHE_HOURS: "8"

          PM_EDGE_MIN_NET_EDGE: "0.04"
          PM_EDGE_MODEL_ERROR_BUFFER: "0.01"
          PM_EDGE_SLIPPAGE_BUFFER: "0.0025"
          PM_EDGE_MIN_MATCH_CONFIDENCE: "0.82"

          PM_EDGE_MAX_ALERTS_PER_RUN: "3"
          PM_EDGE_ALERT_COOLDOWN_HOURS: "6"
          PM_EDGE_MAX_MARKETS: "3000"

          # Price Fish: do not lower the normal 4% edge requirement.
          # Surface passive limits 2c-8c below the current ask, but v19 filters
          # out moonshots: target must be >=20c and model fair chance >=25%.
          PM_EDGE_PRICE_FISH_MIN_GAP: "0.02"
          PM_EDGE_PRICE_FISH_MAX_GAP: "0.08"
          PM_EDGE_PRICE_FISH_MIN_TARGET: "0.20"
          PM_EDGE_PRICE_FISH_MIN_FAIR_SIDE_PROB: "0.25"
          PM_EDGE_MAX_PRICE_FISH_ALERTS_PER_RUN: "4"
          PM_EDGE_PRICE_FISH_DAILY_CAP: "12"

        run: python pm_edge_runner_v19.py
