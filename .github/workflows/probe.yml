name: Probe APIs
on:
  push:
    branches: [probe-data]
    paths: [probe/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python probe/probe.py
      - run: |
          git config user.name pm-edge-bot; git config user.email pm-edge-bot@users.noreply.github.com
          git add probe/out; git commit -m "probe output [skip ci]" && git push
