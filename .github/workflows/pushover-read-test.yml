name: Pushover Read Test

on:
  push:
    paths:
      - ".github/workflows/pushover-read-test.yml"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Pushover read/unread test
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST https://api.pushover.net/1/messages.json \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=🧪 PM Edge Read Test" \
            --form-string "message=This is the read/unread test. It should show as NEW until you open it in Pushover."
