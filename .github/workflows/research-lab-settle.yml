name: Research Lab Settle (paper)

# Nov 4, 2026: grades finished paper plays (Prop Board, Sharp Plays, Odds Fam, Bet Queue) between full
# Research Lab rounds, so a play stops showing open soon after ESPN calls the game final.
# Grading only: no scanning, no new plays, no phone alerts, no Kalshi keys.
# Trigger it from cron-job.org every 5 minutes with a repository_dispatch of type "settle-tick"
# (same setup as the "tick" job, different event_type). GitHub's schedule below is only a backup.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [settle-tick]
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: research-lab-settle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle finished plays
        env:
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
        run: python -m research_lab.settle_only
      - name: Save grades
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add research_lab/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research Lab settle [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && exit 0
            else
              # A full round changed the same lines meanwhile. Drop ours: that round (or the next
              # settle run, a few minutes away) grades the same plays from the same ESPN finals.
              git rebase --abort || true
              echo "Conflict with a full Research Lab round; skipping this save."
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
