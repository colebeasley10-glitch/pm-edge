name: Strategy Research Lab (paper)

# PAPER ONLY. Runs right after each PM Edge Watch run, so it reuses that run's
# sportsbook prices (pm_edge_candidate_ledger.csv) and spends no Odds API credits.
# No Kalshi keys are passed to this workflow: it can only read public market data.
on:
  workflow_run:
    workflows: ["PM Edge Watch"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: research-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Research Lab round (paper)
        env:
          # Nov 1, 2026: phone alerts go through alert_gate.py only (Bet Queue huge-EV +
          # BreakTheBank NFL). Same Pushover account, new names so nothing else can push.
          SHARPIQ_PUSH_USER: ${{ secrets.PUSHOVER_USER_KEY }}
          SHARPIQ_PUSH_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          # Free PinnWire data key (Pinnacle prices) for the v2 strategies. Not a trading key.
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
          # Odds API (same free key as the scanner). The lab spends at most 6 credits/day on
          # named-book moneyline snapshots and stops if the account drops below 60.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PM_EDGE_KALSHI_PUBLIC_BASE_URL: "https://external-api.kalshi.com/trade-api/v2"
        run: python -m research_lab.run
      # Extra Pinnacle prop reads at about T-9 and T-3 minutes when a football kickoff is too close
      # for the next regular round (paper + phone alerts only). Exits at once when nothing is close.
      - name: Kickoff sprint (football props)
        continue-on-error: true
        timeout-minutes: 18
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
        run: python -m research_lab.kickoff_sprint
      - name: Save Research Lab ledgers
        if: always()
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add research_lab/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research Lab round [skip ci]"
          # The settle-only job (research-lab-settle.yml) also writes grades here. If both touched the
          # same lines, keep this round's version (-X theirs = the commit being replayed); it graded
          # from the same ESPN finals, and anything it missed is re-graded minutes later.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
