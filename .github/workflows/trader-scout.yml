name: Trader Scout (one-off, read-only)

# Ranks Polymarket sports bettors by sport from public data. No keys, no alerts, no orders.
on:
  workflow_dispatch:
    inputs:
      wallets:
        description: "Extra wallets to include (space separated)"
        required: false
        default: ""
      mode:
        description: "polymarket (default), kalshi_probe, kalshi, props_probe, or pinn_probe"
        required: false
        default: "polymarket"

concurrency:
  group: trader-scout
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scout traders
        if: github.event.inputs.mode != 'kalshi_probe'
        run: python -m trader_follow.scout ${{ github.event.inputs.wallets }}
      - name: Probe Kalshi social data
        if: github.event.inputs.mode != 'polymarket' && github.event.inputs.mode != ''
        env:
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
        run: python -m trader_follow.${{ github.event.inputs.mode }}
      - name: Save report
        if: always()
        run: |
          git config user.name "pm-edge-bot"
          git config user.email "pm-edge-bot@users.noreply.github.com"
          git add trader_follow/data/scout
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Trader Scout report [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
