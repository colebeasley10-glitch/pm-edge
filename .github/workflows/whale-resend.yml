name: Whale Flow Recheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recheck and resend only currently actionable Whale Flow alerts
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          KALSHI_WRITE_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_WRITE_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python resend_whale_signals.py
