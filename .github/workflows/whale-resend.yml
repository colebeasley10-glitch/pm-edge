name: Whale Flow Correction

on:
  push:
    paths:
      - ".github/workflows/whale-resend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out PM Edge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Whale Flow correction
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python send_whale_correction.py
